name: Run

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
  repository_dispatch:

jobs:
  build:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

    - name: Run
      env:
        CONF: ${{ secrets.CONF }}
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" dotnet Program.cs
